<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaseDesk chat</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f6f8f7; color: #171a19; }
      .wrap { max-width: 420px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: #fff; }
      header { padding: 14px 16px; border-bottom: 1px solid #e5e9e7; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      header .dot { width: 8px; height: 8px; border-radius: 999px; background: #12805c; }
      #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 82%; padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
      .them { align-self: flex-start; background: #f2f5f3; border-top-left-radius: 4px; }
      .me { align-self: flex-end; background: #171a19; color: #fff; border-top-right-radius: 4px; }
      .meta { font-size: 12px; color: #7c8681; }
      form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e5e9e7; }
      input, textarea { font: inherit; }
      #identity { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      #identity input, #msg { border: 1px solid #d6ddd9; border-radius: 10px; padding: 10px 12px; font-size: 14px; width: 100%; }
      button { background: #171a19; color: #fff; border: 0; border-radius: 10px; padding: 0 16px; font-weight: 600; cursor: pointer; }
      .hint { font-size: 12px; color: #7c8681; padding: 0 16px 12px; }
      @media (prefers-color-scheme: dark) {
        body { background: #0e1110; color: #f0f3f1; }
        .wrap { background: #161a18; }
        header, form { border-color: #242a27; }
        .them { background: #1d2220; }
        .me { background: #f0f3f1; color: #141816; }
        #identity input, #msg { background: #0e1110; border-color: #2e3532; color: #f0f3f1; }
        button { background: #f0f3f1; color: #141816; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header><span class="dot"></span> Support</header>
      <div id="identity">
        <div class="meta">Start a conversation — we will reply here.</div>
        <input id="name" placeholder="Your name" />
        <input id="email" placeholder="Your email" type="email" />
        <textarea id="first" placeholder="How can we help?" rows="3"></textarea>
        <button id="start" type="button">Start chat</button>
      </div>
      <div id="log" hidden></div>
      <p class="hint" id="hint" hidden>Connected — replies appear above as your team responds.</p>
      <form id="composer" hidden>
        <input id="msg" placeholder="Message…" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>
    <script>
      // Channel + token come from the embed snippet (?channel=&token=). Defaults target the seeded webchat channel.
      const params = new URLSearchParams(location.search);
      const channel = params.get('channel') || 'ch_1';
      const token = params.get('token') || 'tok_webchat_3f9a2c81';
      const base = params.get('base') || '';
      let email = '';
      let seen = 0;

      const el = (id) => document.getElementById(id);
      function bubble(text, mine) {
        const d = document.createElement('div');
        d.className = 'msg ' + (mine ? 'me' : 'them');
        d.textContent = text;
        el('log').appendChild(d);
        el('log').scrollTop = el('log').scrollHeight;
      }

      async function poll() {
        try {
          const res = await fetch(`${base}/api/channels/${channel}/thread?token=${encodeURIComponent(token)}&contact=${encodeURIComponent(email)}`);
          if (!res.ok) return;
          const msgs = await res.json();
          for (let i = seen; i < msgs.length; i++) {
            const m = msgs[i];
            if (m.authorKind === 'agent') bubble(m.body, false);
          }
          seen = msgs.length;
        } catch { /* keep polling */ }
      }

      el('start').addEventListener('click', async () => {
        const name = el('name').value.trim();
        email = el('email').value.trim();
        const body = el('first').value.trim();
        if (!email || !body) return;
        await fetch(`${base}/api/channels/${channel}/inbound?token=${encodeURIComponent(token)}`, {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ from: { name, email }, body }),
        });
        el('identity').hidden = true;
        el('log').hidden = false;
        el('hint').hidden = false;
        el('composer').hidden = false;
        bubble(body, true);
        seen = 1; // the opener we just sent is the first message
        setInterval(poll, 3000);
        poll();
      });

      el('composer').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = el('msg').value.trim();
        if (!body) return;
        el('msg').value = '';
        bubble(body, true);
        await fetch(`${base}/api/channels/${channel}/inbound?token=${encodeURIComponent(token)}`, {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ from: { email }, body }),
        });
      });
    </script>
  </body>
</html>
